# ============================================================
# NewsLens frontend - nginx site (SPA host + /api reverse proxy)
# In docker-compose, `backend` is the API service name on port 8000.
# ============================================================

# Map X-Forwarded-Proto so the app can tell HTTPS from behind a TLS terminator.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Keep request bodies small at the edge too (mirrors backend MAX_BODY_BYTES).
    client_max_body_size 1m;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # ---- API -> backend ----
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # ---- Immutable hashed assets ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback: let the React router handle unknown paths ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
